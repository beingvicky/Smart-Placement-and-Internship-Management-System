<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus2Career - Smart Internship & Placement System</title>
  <meta name="description" content="Find and manage internships with Campus2Career - India's smart internship and placement management platform for students and companies." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- NAV -->
  <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#" onclick="navigate('home')">
        <div class="brand-logo">
          <i class="fas fa-rocket"></i>
          <span>Campus<span class="brand-accent">2Career</span></span>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-1" id="navLinks">
          <li class="nav-item"><a class="nav-link" href="#" onclick="navigate('home')" id="nav-home"><i class="fas fa-home me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="navigate('internships')" id="nav-internships"><i class="fas fa-briefcase me-1"></i>Internships</a></li>
          <li class="nav-item guest-only" id="nav-dashboard-li" style="display:none"><a class="nav-link" href="#" onclick="navigate('dashboard')" id="nav-dashboard"><i class="fas fa-chart-line me-1"></i>Dashboard</a></li>
          <li class="nav-item guest-only" id="nav-applications-li" style="display:none"><a class="nav-link" href="#" onclick="navigate('applications')" id="nav-applications"><i class="fas fa-file-alt me-1"></i>Applications</a></li>
          <li class="nav-item admin-only" id="nav-admin-li" style="display:none"><a class="nav-link admin-link" href="#" onclick="navigate('admin')" id="nav-admin"><i class="fas fa-shield-alt me-1"></i>Admin Panel</a></li>
          <li class="nav-item auth-hidden" id="nav-login-li"><a class="nav-link btn-nav-login" href="#" onclick="navigate('login')"><i class="fas fa-sign-in-alt me-1"></i>Login</a></li>
          <li class="nav-item auth-hidden" id="nav-register-li"><a class="nav-link btn-nav-register" href="#" onclick="navigate('register')">Get Started <i class="fas fa-arrow-right ms-1"></i></a></li>
          <li class="nav-item auth-shown" id="nav-user-li" style="display:none">
            <div class="dropdown">
              <button class="btn user-dropdown-btn dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown">
                <div class="user-avatar-sm" id="navUserAvatar">A</div>
                <span id="navUserName">User</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end user-dropdown">
                <li><a class="dropdown-item" href="#" onclick="navigate('dashboard')"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
                <li><a class="dropdown-item" href="#" onclick="navigate('profile')"><i class="fas fa-user me-2"></i>Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGES -->
  <div id="page-home" class="page active"></div>
  <div id="page-internships" class="page"></div>
  <div id="page-login" class="page"></div>
  <div id="page-register" class="page"></div>
  <div id="page-dashboard" class="page"></div>
  <div id="page-applications" class="page"></div>
  <div id="page-admin" class="page"></div>
  <div id="page-profile" class="page"></div>

  <!-- APPLY MODAL -->
  <div class="modal fade" id="applyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-700 text-white">Apply for <span id="applyModalTitle" class="text-accent"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="company-badge mb-3" id="applyModalCompany"></div>
          <label class="form-label text-muted small">Cover Letter <span class="text-muted">(optional but recommended)</span></label>
          <textarea id="coverLetter" class="form-control glass-input" rows="5" placeholder="Tell the company why you're a great fit for this role..."></textarea>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-gradient px-4" onclick="submitApplication()">
            <i class="fas fa-paper-plane me-2"></i>Submit Application
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- INTERNSHIP DETAIL MODAL -->
  <div class="modal fade" id="internshipModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-modal" id="internshipModalContent"></div>
    </div>
  </div>

  <!-- ADMIN INTERNSHIP MODAL -->
  <div class="modal fade" id="adminInternshipModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-700 text-white" id="adminModalTitle">Add Internship</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="adminInternshipForm">
            <input type="hidden" id="editId" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small">Job Title *</label>
                <input type="text" id="fTitle" class="form-control glass-input" placeholder="e.g. Software Developer Intern" required />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Company *</label>
                <input type="text" id="fCompany" class="form-control glass-input" placeholder="e.g. Google India" required />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Location</label>
                <input type="text" id="fLocation" class="form-control glass-input" placeholder="e.g. Bangalore" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Stipend (₹/month)</label>
                <input type="number" id="fStipend" class="form-control glass-input" placeholder="e.g. 30000" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Duration</label>
                <input type="text" id="fDuration" class="form-control glass-input" placeholder="e.g. 3 months" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Domain</label>
                <select id="fDomain" class="form-control glass-input">
                  <option value="">Select domain</option>
                  <option>Full Stack</option><option>Data Science</option><option>AI/ML</option>
                  <option>Backend</option><option>Frontend</option><option>Mobile</option>
                  <option>DevOps</option><option>Design</option><option>Security</option><option>Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Openings</label>
                <input type="number" id="fOpenings" class="form-control glass-input" placeholder="5" min="1" />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Status</label>
                <select id="fStatus" class="form-control glass-input">
                  <option value="active">Active</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label text-muted small">Description</label>
                <textarea id="fDescription" class="form-control glass-input" rows="3" placeholder="Describe the internship role..."></textarea>
              </div>
              <div class="col-12">
                <label class="form-label text-muted small">Requirements (skills)</label>
                <input type="text" id="fRequirements" class="form-control glass-input" placeholder="e.g. React, Node.js, Python" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-gradient px-4" onclick="saveInternship()">
            <i class="fas fa-save me-2"></i><span id="adminSaveLabel">Save Internship</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
